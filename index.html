<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar sesión</h2>
        <p class="ayuda">Ingrese sus credenciales para acceder al sistema.</p>
        <form id="login-form">
            <label for="correo">Correo electrónico:</label><br>
            <input type="text" id="correo" placeholder="ejemplo@correo.com">
            <br><br>
            
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres">
            <br><br>
            
            <button type="submit">Ingresar</button>
        </form>
        <p id="mensaje-error" class="mensaje"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
